name: Build Android app

on:
  push:
    branches: [ccr-cddebba4-hi41wi]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleFullRelease assembleLiteRelease --no-daemon
      - name: Rename
        run: |
          cp android/app/build/outputs/apk/full/release/app-full-release.apk SeeFar.apk
          cp android/app/build/outputs/apk/lite/release/app-lite-release.apk SeeFar-lite.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SeeFar-apk
          path: |
            SeeFar.apk
            SeeFar-lite.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: seefar-android
          name: SeeFar Android app
          body: Open this page on your phone, download SeeFar.apk and install it (allow "install unknown apps" for your browser when asked).
          files: |
            SeeFar.apk
            SeeFar-lite.apk
          make_latest: true
